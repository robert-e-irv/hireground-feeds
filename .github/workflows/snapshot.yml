name: Refresh jobs and publish site

# Every 6 hours (off the hour, so GitHub's top-of-hour queue doesn't delay it).
# 6-hourly, not daily, on purpose: we can only learn whether daily is fast
# enough by sampling faster than daily.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HC_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Weekly: re-check the non-games employer boards (recorder/employers.py) and keep only live,
      # correctly named ones. Skips itself when the list is under 7 days old.
      - name: Verify employer boards
        run: python recorder/verify_boards.py --max-age-days 7

      - name: Record snapshot
        id: rec
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python recorder/record.py --root data

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build site/jobs.json with the app's own parser (redistributable sources only).
      # Exits non-zero if over half the feeds failed, so a broken run never replaces a good site.
      - name: Build jobs.json
        id: export
        run: node pipeline/export.mjs --data data --site site

      - name: Upload site for Pages
        if: steps.export.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload raw bodies (kept 30 days, not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit index + run log
        if: always()
        run: |
          git config user.name  "hireground-bot"
          git config user.email "hireground-bot@users.noreply.github.com"
          git add data/index data/runs.jsonl data/first_seen.json.gz recorder/employers_verified.json 2>/dev/null || true
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase --autostash
          git push

      # Dead-man's switch: Healthchecks.io (free) alerts you when this
      # ping stops arriving, or when the run reports failure.
      - name: Ping dead-man's switch (success)
        if: success() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL" > /dev/null

      - name: Ping dead-man's switch (failure)
        if: failure() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/fail" > /dev/null

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
