name: Refresh jobs and publish site

# Hourly (off the hour, so GitHub's top-of-hour queue doesn't delay it). Each run only fetches the
# boards that are due (recorder/sources.py cadence_h): games studios and publishers every hour,
# everything else every 6 hours. The rest is reused from a body cache kept between runs, and every
# fetch asks "changed since last time?" so unchanged boards cost a few hundred bytes.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Refresh every board now, not just the ones that are due"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HC_URL: ${{ secrets.HEALTHCHECK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Weekly: re-check the non-games employer boards (recorder/employers.py) and keep only live,
      # correctly named ones. Skips itself when the list is under 7 days old.
      - name: Verify employer boards
        run: python recorder/verify_boards.py --max-age-days 7

      # Weekly: re-check the games companies imported from Outscal's OpenJobs list
      # (recorder/studio_candidates.json). Only live boards with open jobs reach the site.
      - name: Verify imported studio boards
        run: python recorder/verify_boards.py --set studios --max-age-days 7

      # Latest body + validators for every board, carried between runs. Each run saves a new
      # entry (cache keys are immutable); GitHub evicts old ones. A miss just means a full refresh.
      - name: Restore body cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: bodies-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bodies-

      - name: Record snapshot
        id: rec
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full && '--all' || '' }}
        run: python recorder/record.py --root data --cache cache $FULL

      - name: Save body cache
        if: always() && steps.rec.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: bodies-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Build site/jobs.json with the app's own parser (redistributable sources only).
      # Exits non-zero if over half the feeds failed, so a broken run never replaces a good site.
      - name: Build jobs.json
        id: export
        run: node pipeline/export.mjs --data data --site site --cache cache

      - name: Upload site for Pages
        if: steps.export.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload raw bodies (kept 14 days, not committed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit index + run log
        if: always()
        run: |
          git config user.name  "hireground-bot"
          git config user.email "hireground-bot@users.noreply.github.com"
          git add data/index data/runs.jsonl data/first_seen.json.gz recorder/employers_verified.json recorder/studios_verified.json 2>/dev/null || true
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          # runs.jsonl merges as a union (.gitattributes); for anything else this run's newer data wins,
          # so a commit that landed on main mid-run can't fail the publish.
          git pull --rebase --autostash -X theirs
          git push

      # Dead-man's switch: Healthchecks.io (free) alerts you when this
      # ping stops arriving, or when the run reports failure.
      - name: Ping dead-man's switch (success)
        if: success() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL" > /dev/null

      - name: Ping dead-man's switch (failure)
        if: failure() && env.HC_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HC_URL/fail" > /dev/null

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
